<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatGPT GitHub Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <p class="eyebrow">GitHub + ChatGPT</p>
    <h1>Тестовый проект работает</h1>
    <p id="status">Этот сайт создан ChatGPT прямо в твоём репозитории.</p>

    <section class="cube-demo" aria-label="Управляемый 3D-куб">
      <div class="scene" id="scene">
        <div class="cube" id="cube">
          <div class="face front">1</div>
          <div class="face back">2</div>
          <div class="face right">3</div>
          <div class="face left">4</div>
          <div class="face top">5</div>
          <div class="face bottom">6</div>
        </div>
      </div>
      <p class="cube-caption">Потяни куб мышью или пальцем</p>
      <button id="colorButton" class="color-button" type="button">Сменить цвет куба</button>
    </section>

    <div class="counter">
      <span>Нажатий:</span>
      <strong id="count">0</strong>
    </div>

    <button id="button" type="button">Нажми меня</button>
    <button id="reset" class="secondary" type="button">Сбросить</button>

    <p class="hint">Код меняется в GitHub, а результат проверяется в Codespaces.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
