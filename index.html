<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050816" />
  <title>Cosmic Three.js Scene</title>
  <link rel="stylesheet" href="style.css?v=5" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Three.js · Procedural Space</p>
        <h1>Глубокий космос</h1>
        <p id="status" class="subtitle">Интерактивная сцена: планета, кольца, спутник, туманность и тысячи звёзд.</p>
      </div>
      <div class="badge">LIVE 3D</div>
    </header>

    <section class="space-panel" aria-label="Интерактивная космическая Three.js сцена">
      <div id="threeScene" class="three-scene">
        <div class="scene-overlay">
          <span>DRAG · вращение</span>
          <span>SCROLL · масштаб</span>
        </div>
      </div>

      <div class="controls-row">
        <button id="paletteButton" class="primary" type="button">Сменить атмосферу</button>
        <button id="rotationButton" class="secondary" type="button">Остановить движение</button>
        <button id="resetButton" class="secondary" type="button">Вернуть камеру</button>
      </div>
    </section>

    <footer class="footer-note">
      <span>Сцена генерируется кодом — без загруженных текстур и 3D-моделей.</span>
      <span class="pulse-dot" aria-hidden="true"></span>
    </footer>
  </main>

  <script type="module" src="script.js?v=5"></script>
</body>
</html>
