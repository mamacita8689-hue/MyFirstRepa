<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js GitHub Demo</title>
  <link rel="stylesheet" href="style.css?v=4" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="card">
    <p class="eyebrow">GitHub + ChatGPT + Three.js</p>
    <h1>Настоящая 3D-сцена</h1>
    <p id="status">Теперь куб — это объект Three.js, а не HTML/CSS-имитация.</p>

    <section class="three-demo" aria-label="Интерактивная Three.js сцена">
      <div id="threeScene" class="three-scene"></div>

      <div class="scene-help">
        <span>🖱️ Тяни — вращение</span>
        <span>🔍 Колесо — масштаб</span>
        <span>📱 Работает пальцем</span>
      </div>

      <div class="scene-actions">
        <button id="colorButton" class="primary" type="button">Сменить материал</button>
        <button id="rotationButton" class="secondary" type="button">Остановить вращение</button>
      </div>
    </section>

    <div class="counter">
      <span>Тест JavaScript:</span>
      <strong id="count">0</strong>
    </div>

    <button id="button" type="button">Нажми меня</button>
    <button id="reset" class="secondary" type="button">Сбросить</button>

    <p class="hint">Следующий шаг: заменить куб собственной моделью GLB.</p>
  </main>

  <script type="module" src="script.js?v=4"></script>
</body>
</html>
